name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest

    # All NEXT_PUBLIC_* vars are shipped to the browser bundle by design,
    # so there's nothing sensitive to protect here -- these are just
    # placeholders so `next build` (which touches lib/supabase.ts and
    # sitemap.ts/robots.ts at build time) doesn't fail on missing env vars.
    # This job checks that the app builds correctly, not that it talks to
    # a real backend/Supabase project; swap in repo secrets here instead
    # if that ever changes.
    env:
      NEXT_PUBLIC_API_URL: https://series-recommendation-backend.onrender.com
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: https://series-recommendation-frontend.vercel.app
      NEXT_PUBLIC_ADMIN_EMAIL: admin@example.com

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
